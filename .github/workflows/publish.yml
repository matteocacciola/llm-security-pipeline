name: Publish to PyPI

# Trusted publishing: PyPI trusts a short-lived OIDC token minted by GitHub
# for this repository and workflow, so there is no API token to store,
# leak, or rotate. Configure the trusted publisher once on PyPI
# (project settings -> Publishing) with this repository and workflow file.
#
# One-time repository setup this workflow relies on:
#   * PyPI: add a trusted publisher for this repo, workflow "publish.yml",
#     environment "pypi".
#   * GitHub: create the "pypi" environment (Settings -> Environments);
#     optionally require a reviewer on it, which makes every release a
#     deliberate click.
#
# Every action is pinned to a commit SHA rather than a tag. A tag can be
# moved; a SHA cannot. The tag is kept as a comment so a human can see
# what version the SHA stands for, and Dependabot keeps both in step.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refuse to publish a version that does not match the tag
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "pyproject.toml says $VERSION but the tag is $TAG"; exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Software bill of materials
        # Written OUTSIDE dist/: the publish step uploads everything in
        # dist/ to PyPI, and a .json is not a distribution.
        run: |
          python -m pip install cyclonedx-bom
          python -m pip install dist/*.whl
          mkdir -p sbom
          cyclonedx-py environment --output-format json --output-file sbom/sbom.cyclonedx.json

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # the OIDC token trusted publishing exchanges for a PyPI upload
      contents: write   # to attach the SBOM to the GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true

      - name: Attach SBOM to the release
        # No checkout in this job, so gh needs to be told the repository.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" -R "$REPO" --generate-notes --verify-tag || true
          gh release upload "$TAG" -R "$REPO" sbom/sbom.cyclonedx.json --clobber
